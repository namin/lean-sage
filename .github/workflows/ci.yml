name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Smoke
        run: |
          lake exe smoke | tee /tmp/smoke.out
          ! grep "XX " /tmp/smoke.out
      - name: Demos
        run: |
          lake exe demos | tee /tmp/demos.out
          ! grep "XX " /tmp/demos.out
      - name: ProofBasedSmoke
        run: |
          lake exe proofBasedSmoke | tee /tmp/proofBasedSmoke.out
          ! grep "XX " /tmp/proofBasedSmoke.out
      - name: Verify no sorries
        run: |
          ! grep -rn "sorry$" LeanBlack/
